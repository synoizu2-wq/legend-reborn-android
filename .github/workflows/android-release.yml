name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure temporary Android signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/legend-reborn-release.keystore" -storepass android -keypass android -alias legend-reborn -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Legend Reborn, OU=Build, O=Synoizu, L=Unknown, ST=Unknown, C=EG"
          export LEGEND_KEYSTORE="$RUNNER_TEMP/legend-reborn-release.keystore"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("export_presets.cfg")
          lines = path.read_text(encoding="utf-8").splitlines()
          values = {
              "keystore/release": os.environ["LEGEND_KEYSTORE"],
              "keystore/release_user": "legend-reborn",
              "keystore/release_password": "android",
          }
          for key, value in values.items():
              prefix = key + "="
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {key} entry, found {len(matches)}")
              lines[matches[0]] = prefix + json.dumps(value)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f Main.tscn
          test -f scripts/main.gd
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          scene = Path("Main.tscn").read_text(encoding="utf-8")
          assert 'path="res://scripts/main.gd"' in scene, "Main.tscn script path is incorrect"
          script = Path("scripts/main.gd").read_text(encoding="utf-8")
          assert "func _ready()" in script and "func _cpu_turn()" in script, "Game script is incomplete"
          cards = json.loads(Path("cards.json").read_text(encoding="utf-8"))
          assert isinstance(cards.get("cards"), list) and cards["cards"], "cards.json has no cards"
          preset = Path("export_presets.cfg").read_text(encoding="utf-8")
          assert '[preset.0]' in preset and 'platform="Android"' in preset, "Android preset missing"
          for key in ("keystore/release", "keystore/release_user", "keystore/release_password"):
              assert len(re.findall(r"^" + re.escape(key) + r"=", preset, re.M)) == 1, f"Missing or duplicate {key}"
          print("Project file validation passed.")
          PY

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export signed release APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/LegendReborn-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegendReborn-Android-APK
          path: build/LegendReborn-Android.apk
          if-no-files-found: error
          retention-days: 30
