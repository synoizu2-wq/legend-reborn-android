name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"

      - name: Download Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install -m 0755 Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure temporary Android signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/legend-reborn-release.keystore" -storepass android -keypass android -alias legend-reborn -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Legend Reborn, OU=Build, O=Synoizu, L=Unknown, ST=Unknown, C=EG"
          export LEGEND_KEYSTORE="$RUNNER_TEMP/legend-reborn-release.keystore"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("export_presets.cfg")
          lines = path.read_text(encoding="utf-8").splitlines()
          values = {
              "keystore/release": os.environ["LEGEND_KEYSTORE"],
              "keystore/release_user": "legend-reborn",
              "keystore/release_password": "android",
          }
          for key, value in values.items():
              prefix = key + "="
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {key} entry, found {len(matches)}")
              lines[matches[0]] = prefix + json.dumps(value)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f Main.tscn
          test -f scripts/main.gd
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          scene = Path("Main.tscn").read_text(encoding="utf-8")
          assert 'path="res://scripts/main.gd"' in scene, "Main.tscn script path is incorrect"
          script = Path("scripts/main.gd").read_text(encoding="utf-8")
          assert "func _ready()" in script and "func _cpu_turn()" in script, "Game script is incomplete"
          cards = json.loads(Path("cards.json").read_text(encoding="utf-8"))
          assert isinstance(cards.get("cards"), list) and cards["cards"], "cards.json has no cards"
          preset = Path("export_presets.cfg").read_text(encoding="utf-8")
          assert '[preset.0]' in preset and 'platform="Android"' in preset, "Android preset missing"
          project = Path("project.godot").read_text(encoding="utf-8")
          assert "textures/vram_compression/import_etc2_astc=true" in project, "Android export requires ETC2/ASTC texture import"
          for key in ("keystore/release", "keystore/release_user", "keystore/release_password"):
              assert len(re.findall(r"^" + re.escape(key) + r"=", preset, re.M)) == 1, f"Missing or duplicate {key}"
          print("Project file validation passed.")
          PY

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          test -n "$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          adb start-server
          adb version
          adb devices -l
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          settings = Path.home() / ".config/godot/editor_settings-4.3.tres"
          lines = [
              '[gd_resource type="EditorSettings" format=3]',
              '',
              '[resource]',
              'export/android/android_sdk_path = ' + json.dumps(os.environ["ANDROID_HOME"]),
              'export/android/java_sdk_path = ' + json.dumps(os.environ["JAVA_HOME"]),
          ]
          settings.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Configured Godot Android SDK: {os.environ['ANDROID_HOME']}")
          print(f"Configured Godot Java SDK: {os.environ['JAVA_HOME']}")
          PY

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export signed release APK
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          adb start-server
          adb version
          mkdir -p build
          godot --headless --verbose --path . --export-release "Android" build/LegendReborn-Android.apk
          test -s build/LegendReborn-Android.apk
          file build/LegendReborn-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegendReborn-Android-APK
          path: build/LegendReborn-Android.apk
          if-no-files-found: error
          retention-days: 30
